<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password Reset</title>
  </head>

  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #f4f4f4;
      font-family: Arial, sans-serif;
    "
  >
    <table
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="padding: 40px 20px"
    >
      <tr>
        <td align="center">
          <table
            width="600"
            cellpadding="0"
            cellspacing="0"
            style="
              max-width: 600px;
              background-color: #ffffff;
              border-radius: 10px;
              padding: 40px;
            "
          >
            <tr>
              <td>
                <h1 style="margin-top: 0; color: #222">Password Reset</h1>

                <p style="font-size: 16px; color: #444">Hello, {{username}}!</p>

                <p style="font-size: 16px; color: #444; line-height: 1.5">
                  We received a request to reset your password. Click the button
                  below to create a new password.
                </p>

                <p style="text-align: center; margin: 30px 0">
                  <a
                    href="{{resetLink}}"
                    style="
                      display: inline-block;
                      padding: 14px 24px;
                      background-color: #007bff;
                      color: #ffffff;
                      text-decoration: none;
                      border-radius: 6px;
                      font-size: 16px;
                    "
                  >
                    Reset Password
                  </a>
                </p>

                <p style="font-size: 14px; color: #777; line-height: 1.5">
                  This link is valid for 15 minutes. If you did not request a
                  password reset, you can safely ignore this email.
                </p>

                <p style="font-size: 14px; color: #777">
                  Best regards,<br />
                  Your application team
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
